<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#1b1640" />
  <title>KURA · Iniciar sesión</title>
  <link rel="preload" href="assets/img/fondo.webp" as="image" />
  <link rel="preload" href="assets/img/familia.webp" as="image" />
  <link rel="preload" href="assets/fonts/playfair-display-latin-400-italic.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="styles.css" />
  <script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
</head>
<body>
  <div class="backdrop" aria-hidden="true"></div>

  <main class="stage" id="stage">
    <div class="scene" id="scene" aria-hidden="true">
      <div class="layer layer-bg" data-depth="6"><img src="assets/img/fondo.webp" alt="" /></div>
      <div class="layer layer-family" data-depth="14"><img src="assets/img/familia.webp" alt="" /></div>
      <canvas class="fx" id="fx"></canvas>
      <div class="scene-fade"></div>
    </div>

    <h1 class="logo" id="logo"><img src="assets/img/logo.png" alt="KURA" /></h1>

    <button class="sound" id="sound" type="button" aria-pressed="true" aria-label="Silenciar">
      <svg class="ico ico-on" viewBox="0 0 48 48" aria-hidden="true"><path d="M5 19h9l11-9v28L14 29H5Z" class="fill" /><path d="M31 16q8 8 0 16 M36 10q14 14 0 28" /></svg>
      <svg class="ico ico-off" viewBox="0 0 48 48" aria-hidden="true"><path d="M5 19h9l11-9v28L14 29H5Z" /><path d="m31 17 12 14m0-14L31 31" /></svg>
    </button>

    <section class="panel" id="panel" aria-labelledby="titulo">
      <div class="panel-glass"></div>
      <div class="panel-edge"></div>
      <div class="panel-sweep"></div>

      <h2 class="title" id="titulo">
        <span class="title-line" data-split>Un nuevo tu,</span>
        <span class="title-line" data-split>Un nuevo mundo</span>
      </h2>
      <p class="welcome"><span class="rule"></span><span class="welcome-text">Bienvenido a Kura</span><span class="rule"></span></p>

      <form class="form" id="form" novalidate>
        <label class="field" id="field-email">
          <svg class="ico" viewBox="0 0 48 48" aria-hidden="true"><rect x="5" y="10" width="38" height="28" rx="3" /><path d="m6 12 18 15 18-15" /></svg>
          <span class="sr">Correo electrónico</span>
          <input id="email" name="email" type="email" inputmode="email" autocomplete="email" placeholder="Correo electrónico" aria-describedby="err-email" />
        </label>
        <label class="field" id="field-pass">
          <svg class="ico" viewBox="0 0 48 48" aria-hidden="true"><rect x="10" y="22" width="28" height="23" rx="4" /><path d="M15 22V13a9 9 0 0 1 18 0v9 M24 30v7" /></svg>
          <span class="sr">Contraseña</span>
          <input id="pass" name="password" type="password" autocomplete="current-password" placeholder="Contraseña" aria-describedby="err-email" />
          <button class="eye" id="eye" type="button" aria-label="Mostrar contraseña" aria-pressed="false">
            <svg class="ico" viewBox="0 0 48 48" aria-hidden="true"><path d="M3 24Q24 0 45 24Q24 48 3 24Z" /><circle cx="24" cy="24" r="7" /><path class="slash" d="M8 40 40 8" /></svg>
          </button>
        </label>
        <p class="error" id="err-email" role="alert" aria-live="assertive"></p>

        <a class="forgot link" href="#a03" data-soon="Recuperar contraseña">Olvidé mi contraseña</a>

        <button class="cta" id="cta" type="submit">
          <span class="cta-halo"></span>
          <span class="cta-core"></span>
          <span class="cta-light"></span>
          <span class="cta-sheen"></span>
          <span class="cta-edge"></span>
          <span class="cta-flare cta-flare-top"></span>
          <span class="cta-flare cta-flare-bottom"></span>
          <span class="cta-label"><span class="cta-text">Iniciar sesión</span>
            <svg class="cta-arrow" viewBox="0 0 48 48" aria-hidden="true"><path d="M5 24h36 M29 11l13 13-13 13" /></svg>
          </span>
          <span class="cta-orbit" aria-hidden="true"><i></i><i></i><i></i></span>
        </button>

        <p class="or"><span class="rule"></span><span>o</span><span class="rule"></span></p>

        <button class="google" id="google" type="button" data-soon="Continuar con Google">
          <span class="google-light"></span>
          <svg class="g" viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" />
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z" />
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z" />
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" />
          </svg>
          <span>Continuar con Google</span>
        </button>

        <p class="first">¿Primera vez aquí? <a class="link" href="#a02" data-soon="Crear cuenta">Crear cuenta</a></p>
        <p class="legal"><a href="#terminos" data-soon="Términos">Términos</a><span>•</span><a href="#privacidad" data-soon="Privacidad">Privacidad</a></p>
      </form>
    </section>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>

  <script src="vendor/gsap.min.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
