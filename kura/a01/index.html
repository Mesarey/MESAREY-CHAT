<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#120f33" />
  <title>KURA · Iniciar sesión</title>
  <link rel="preload" href="assets/img/escena.webp" as="image" fetchpriority="high" />
  <link rel="preload" href="assets/fonts/playfair-display-latin-400-italic.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="styles.css" />
  <script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
</head>
<body>
  <div class="backdrop" aria-hidden="true"></div>

  <main class="stage" id="stage">
    <!-- 1–7: cielo y arquitectura, nubes, grupo, bruma y luces (se construyen en js/scene.js) -->
    <div class="scene" id="scene" aria-hidden="true"></div>

    <!-- 8: logo y audio -->
    <h1 class="logo"><img src="assets/img/logo.png" alt="KURA" width="776" height="641" /></h1>
    <button class="sound" id="sound" type="button" aria-pressed="true" data-i18n-attr="aria-label:soundOn">
      <svg class="ico ico-on" viewBox="0 0 48 48" aria-hidden="true"><path d="M5 19h9l11-9v28L14 29H5Z" class="fill" /><path d="M31 16q8 8 0 16 M36 10q14 14 0 28" /></svg>
      <svg class="ico ico-off" viewBox="0 0 48 48" aria-hidden="true"><path d="M5 19h9l11-9v28L14 29H5Z" /><path d="m31 17 12 14m0-14L31 31" /></svg>
    </button>

    <!-- 9–11: título, cristal, bordes y controles -->
    <div class="content">
      <header class="heading">
        <h2 class="title" id="titulo">
          <span class="title-line" data-split data-i18n="title1">Un nuevo tu,</span>
          <span class="title-line" data-split data-i18n="title2">Un nuevo mundo</span>
        </h2>
        <p class="welcome"><span class="rule"></span><span class="welcome-text" data-i18n="welcome">Bienvenido a Kura</span><span class="rule"></span></p>
      </header>

      <section class="panel" id="panel" aria-labelledby="titulo">
        <div class="panel-glass" aria-hidden="true"></div>
        <form class="form" id="form" novalidate>
          <label class="field" id="field-email">
            <svg class="ico" viewBox="0 0 48 48" aria-hidden="true"><rect x="5" y="10" width="38" height="28" rx="3" /><path d="m6 12 18 15 18-15" /></svg>
            <span class="sr" data-i18n="email">Correo electrónico</span>
            <input id="email" name="email" type="email" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false" data-i18n-attr="placeholder:email" placeholder="Correo electrónico" aria-describedby="form-msg" />
          </label>
          <label class="field" id="field-pass">
            <svg class="ico" viewBox="0 0 48 48" aria-hidden="true"><rect x="10" y="22" width="28" height="23" rx="4" /><path d="M15 22V13a9 9 0 0 1 18 0v9 M24 30v7" /></svg>
            <span class="sr" data-i18n="password">Contraseña</span>
            <input id="pass" name="password" type="password" autocomplete="current-password" data-i18n-attr="placeholder:password" placeholder="Contraseña" aria-describedby="form-msg" />
            <button class="eye" id="eye" type="button" aria-pressed="false" data-i18n-attr="aria-label:showPass">
              <svg class="ico" viewBox="0 0 48 48" aria-hidden="true"><path d="M3 24Q24 0 45 24Q24 48 3 24Z" /><circle cx="24" cy="24" r="7" /><path class="slash" d="M8 40 40 8" /></svg>
            </button>
          </label>

          <div class="row-msg">
            <p class="msg" id="form-msg" role="status" aria-live="polite"></p>
            <a class="link forgot" href="#a03" data-soon data-i18n="forgot">Olvidé mi contraseña</a>
          </div>

          <button class="cta" id="cta" type="submit">
            <span class="cta-glass" aria-hidden="true"></span>
            <span class="cta-label"><span data-i18n="signIn">Iniciar sesión</span>
              <svg class="cta-arrow" viewBox="0 0 48 48" aria-hidden="true"><path d="M5 24h36 M29 11l13 13-13 13" /></svg>
            </span>
            <span class="cta-loading" aria-hidden="true"><i></i><i></i><i></i></span>
          </button>

          <p class="or"><span class="rule"></span><span data-i18n="or">o</span><span class="rule"></span></p>

          <button class="google" id="google" type="button">
            <svg class="g" viewBox="0 0 48 48" aria-hidden="true">
              <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" />
              <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z" />
              <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z" />
              <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" />
            </svg>
            <span data-i18n="google">Continuar con Google</span>
          </button>

          <p class="first"><span data-i18n="firstTime">¿Primera vez aquí?</span> <a class="link" href="#a02" data-soon data-i18n="createAccount">Crear cuenta</a></p>
          <p class="legal"><a href="#terminos" data-soon data-i18n="terms">Términos</a><span aria-hidden="true">•</span><a href="#privacidad" data-soon data-i18n="privacy">Privacidad</a></p>
        </form>
      </section>

      <nav class="prefs" aria-label="Preferencias">
        <button type="button" id="lang" class="pref" data-i18n="otherLang">English</button>
        <span aria-hidden="true">·</span>
        <button type="button" id="fx-toggle" class="pref" aria-pressed="false" data-i18n="reduceFx">Reducir efectos</button>
      </nav>
    </div>

    <!-- Estrellas y chispas (Three.js). Solo decorativo. -->
    <canvas class="fx" id="fx" aria-hidden="true"></canvas>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>

  <script src="vendor/gsap.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
