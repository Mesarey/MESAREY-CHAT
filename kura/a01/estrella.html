<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>KURA · Estrella 3D de cerca</title>
  <!-- Vista de revisión: la estrella de la mano de Alaira (A06) ampliada, con el mismo render de la app. -->
  <script type="importmap">{ "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/jsm/" } }</script>
  <style>
    html, body { margin: 0; height: 100%; background: #1d1636; color: #efe4ff; font-family: Georgia, 'Times New Roman', serif; overflow: hidden; }
    .wrap { position: fixed; inset: 0; display: grid; place-items: center; }
    .view { --s: calc(min(100vw, 100svh - 120px) / 220); position: relative; width: calc(220 * var(--s)); height: calc(220 * var(--s)); overflow: hidden; border-radius: 18px; box-shadow: 0 0 40px rgba(150, 110, 220, .35); }
    .view img { position: absolute; left: calc(-75 * var(--s)); top: calc(-508 * var(--s)); width: calc(959 * var(--s)); max-width: none; }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .cap { position: fixed; left: 0; right: 0; text-align: center; font-size: 14px; letter-spacing: .06em; opacity: .85; padding: 0 16px; }
    .top { top: max(18px, env(safe-area-inset-top)); font-style: italic; font-size: 17px; }
    .bottom { bottom: max(18px, env(safe-area-inset-bottom)); opacity: .65; }
  </style>
</head>
<body>
  <p class="cap top">Estrella 3D · gira 0° → 180° → 0° sobre su eje</p>
  <div class="wrap">
    <div class="view" id="view">
      <img src="assets/a06/escena/placa.webp" alt="" />
      <canvas id="c"></canvas>
    </div>
  </div>
  <p class="cap bottom">Tócala para que brille · inclina o mueve el cursor</p>
  <script type="module">
    import { createAlaira } from './js/alaira.js';
    const motion = { reduced: false, onChange() {} };
    const a = await createAlaira({ canvas: document.getElementById('c'), motion, view: [51, 484, 220, 220] });
    if (a) {
      a.start();
      const view = document.getElementById('view');
      view.addEventListener('pointerdown', () => a.shine());
      addEventListener('pointermove', (e) => a.look([(e.clientX / innerWidth) * 2 - 1, (e.clientY / innerHeight) * 2 - 1]));
      // el visor manda la inclinación simulada por aquí
      window.__kura = { tilt: { simulate: (g, b) => a.look([Math.max(-1, Math.min(1, g / 18)), Math.max(-1, Math.min(1, (b - 45) / 18))]) } };
    } else {
      document.querySelector('.top').textContent = 'Este navegador no tiene WebGL: no se puede mostrar la estrella 3D.';
    }
  </script>
</body>
</html>
