<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>KURA · Estrella 3D de cerca</title>
  <!-- Vista de revisión: la estrella de la mano de Alaira (A06) ampliada, con el mismo render de la app. -->
  <script type="importmap">{ "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/jsm/" } }</script>
  <style>
    html, body { margin: 0; height: 100%; background: #1d1636; color: #efe4ff; font-family: Georgia, 'Times New Roman', serif; overflow: hidden; }
    .wrap { position: fixed; inset: 0; display: grid; place-items: center; }
    /* recorte del lienzo de A06 alrededor de la mano: x 41…281, y 444…734 */
    .view { --s: calc(min(100vw - 24px, (100svh - 140px) * 240 / 290) / 240); position: relative; width: calc(240 * var(--s)); height: calc(290 * var(--s)); overflow: hidden; border-radius: 18px; box-shadow: 0 0 40px rgba(150, 110, 220, .35); background: #2b2347; }
    .view img { position: absolute; max-width: none; }
    .cielo { left: calc(-89 * var(--s)); top: calc(-492 * var(--s)); width: calc(1007 * var(--s)); }
    .alaira { left: calc(-89 * var(--s)); top: calc(-367 * var(--s)); width: calc(1007 * var(--s)); }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .cap { position: fixed; left: 0; right: 0; text-align: center; font-size: 14px; letter-spacing: .06em; opacity: .85; padding: 0 16px; margin: 0; }
    .top { top: max(18px, env(safe-area-inset-top)); font-style: italic; font-size: 17px; }
    .bottom { bottom: max(18px, env(safe-area-inset-bottom)); opacity: .65; }
    .err { color: #ffd2a8; }
  </style>
</head>
<body>
  <p class="cap top" id="top">Estrella 3D · gira 0° → 180° → 0° sobre su eje</p>
  <div class="wrap">
    <div class="view" id="view">
      <img class="cielo" src="assets/a06/escena/cielo.webp" alt="" />
      <img class="alaira" src="assets/a06/alaira/alaira.webp" alt="" />
      <canvas id="c"></canvas>
    </div>
  </div>
  <p class="cap bottom">Tócala para que brille</p>
  <script type="module">
    const top = document.getElementById('top');
    try {
      const { createStar3D } = await import('./js/estrella3d.js');
      const s = await createStar3D({ canvas: document.getElementById('c'), motion: { reduced: false }, centro: [161, 594], vista: [41, 444, 240, 290] });
      s.start();
      document.getElementById('view').addEventListener('pointerdown', () => s.shine());
    } catch (err) {
      // si algo falla, se dice aquí mismo (así se puede saber por qué en el teléfono)
      top.classList.add('err');
      top.textContent = 'No se pudo mostrar la estrella 3D: ' + (err && err.message ? err.message : err);
      console.error(err);
    }
  </script>
</body>
</html>
